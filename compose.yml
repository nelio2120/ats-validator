services:
  ats-validator:
    build:
      context: .
      dockerfile: Containerfile
    image: ats-validator:latest
    container_name: ats-validator
    ports:
      - "${HOST_PORT:-8080}:${SERVER_PORT:-8080}"
    environment:
      # Memoria JVM (ajustar según necesidades)
      - JAVA_OPTS=${JAVA_OPTS:--Xms256m -Xmx1024m}
      # Puerto del servidor (opcional, por defecto 8080)
      - SERVER_PORT=${SERVER_PORT:-8080}
    # Límites de recursos (claves top-level: se aplican sin necesitar Swarm,
    # a diferencia de deploy.resources, que Compose ignora fuera de Swarm mode)
    cpus: ${CPU_LIMIT:-2}
    mem_limit: ${MEMORY_LIMIT:-1536M}
    mem_reservation: ${MEMORY_RESERVATION:-512M}
    # Reinicio automático
    restart: unless-stopped
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SERVER_PORT:-8080}/api/ats/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
