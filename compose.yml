services:
  ats-validator:
    build:
      context: .
      dockerfile: Containerfile
    image: ats-validator:latest
    container_name: ats-validator
    ports:
      - "8080:8080"
    environment:
      # Memoria JVM (ajustar según necesidades)
      - JAVA_OPTS=-Xms256m -Xmx1024m
      # Puerto del servidor (opcional, por defecto 8080)
      - SERVER_PORT=8080
    # Límites de recursos (opcional, recomendado para producción)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 512M
    # Reinicio automático
    restart: unless-stopped
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/ats/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
